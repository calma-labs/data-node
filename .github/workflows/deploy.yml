name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PROJECT: calmal
      VM: dashboard
      DEPLOY_DIR: /var/www/data-node-poc

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve VM zone
        id: vm
        run: |
          ZONE=$(gcloud compute instances list \
            --project=$PROJECT \
            --filter="name=$VM" \
            --format="get(zone)" | xargs basename)
          echo "zone=$ZONE" >> $GITHUB_OUTPUT

      - name: Backup current deployment
        id: backup
        run: |
          gcloud compute ssh $VM \
            --project=$PROJECT \
            --zone=${{ steps.vm.outputs.zone }} \
            --tunnel-through-iap \
            --command="rsync -a --delete --exclude=node_modules $DEPLOY_DIR/ ${DEPLOY_DIR}.bak/"

      - name: Upload new files
        run: |
          tar --exclude=./node_modules --exclude=./.git -czf /tmp/app.tar.gz .
          gcloud compute scp /tmp/app.tar.gz $VM:/tmp/app.tar.gz \
            --project=$PROJECT \
            --zone=${{ steps.vm.outputs.zone }} \
            --tunnel-through-iap

      - name: Install and reload
        id: reload
        run: |
          gcloud compute ssh $VM \
            --project=$PROJECT \
            --zone=${{ steps.vm.outputs.zone }} \
            --tunnel-through-iap \
            --command="
              set -e
              tar -xzf /tmp/app.tar.gz -C $DEPLOY_DIR
              cd $DEPLOY_DIR
              npm install --production
              pm2 startOrReload ecosystem.config.js --env production
            "

      - name: Rollback on failure
        if: failure() && steps.backup.conclusion == 'success'
        run: |
          gcloud compute ssh $VM \
            --project=$PROJECT \
            --zone=${{ steps.vm.outputs.zone }} \
            --tunnel-through-iap \
            --command="
              set -e
              rsync -a --delete --exclude=node_modules ${DEPLOY_DIR}.bak/ $DEPLOY_DIR/
              cd $DEPLOY_DIR
              pm2 startOrReload ecosystem.config.js --env production
            "
